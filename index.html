<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYU-Idaho Class Scheduler</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/app.js" defer></script>
</head>

<body>
  <header>
    <h1>BYU-Idaho Class Scheduler</h1><span id="termLabel"></span>
    <button type="button" id="togglePanel" aria-controls="classPanel"></button>
  </header>
  <main id="layout">
    <aside id="classPanel" aria-label="Class search">
      <div class="filters">
        <input type="search" id="q" aria-label="Search classes"
          placeholder="Search code, title, e.g. “CSE 210” or “accounting”">
        <select id="subject" aria-label="Subject">
          <option value="">All subjects</option>
        </select>
        <select id="delivery" aria-label="Delivery method">
          <option value="">Any delivery</option>
        </select>
        <label><input type="checkbox" id="hideConflicts"> Hide sections that conflict with my schedule</label>
        <label><input type="checkbox" id="hideClosed"> Hide closed sections</label>
      </div>
      <div class="count" id="count" role="status"></div>
      <div id="results"></div>
    </aside>
    <section class="cal" aria-label="Weekly schedule">
      <div class="summary" id="summary"></div>
      <div id="calwrap">
        <div class="grid" id="grid"></div>
      </div>
      <div class="noTime" id="noTime"></div>
    </section>
  </main>
</body>

</html>
